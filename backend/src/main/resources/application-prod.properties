# ===================================================================
# RentFlow AI - Production Profile Configuration
# Active with: spring.profiles.active=prod
# ===================================================================

spring.application.name=RentFlow AI Backend (Production)
server.port=${PORT:8080}

# Database (PostgreSQL)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rentflow}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=RentFlowProdHikariPool

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled in Production)
spring.h2.console.enabled=false

# Production Security & CORS
security.jwt.secret=${JWT_SECRET:}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.rentflow.ai,https://portal.rentflow.ai}

# AI Engine Configuration
ai.enabled=${AI_ENABLED:true}
ai.provider=${AI_PROVIDER:gemini}
ai.model=${AI_MODEL:gemini-1.5-pro}
ai.api-key=${AI_API_KEY:}
ai.timeout-ms=${AI_TIMEOUT_MS:10000}
ai.daily-request-limit=${AI_DAILY_LIMIT:2000}

# Telephony Configuration (Phone AI)
telephony.provider=${TELEPHONY_PROVIDER:mock}
telephony.recording-default-enabled=false
telephony.transcription-enabled=true
telephony.transcript-retention-days=90

# Rate Limiting
security.ratelimit.requests-per-minute=${RATE_LIMIT_RPM:60}

# Logging
logging.level.root=INFO
logging.level.com.rentflow=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
