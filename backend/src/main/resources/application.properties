spring.application.name=RentFlow AI Backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:rentflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# Security & JWT Configuration
security.jwt.secret=${RENTFLOW_JWT_SECRET:rentflow-ai-development-jwt-secret-key-32bytes-long!}
security.jwt.access-token-expiration=${JWT_EXPIRATION_SECONDS:3600}

# Centralized CORS Configuration
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# Rate Limiting Configuration (Per Minute)
security.ratelimit.requests-per-minute=${RATE_LIMIT_RPM:60}
security.rate-limit.login.capacity=10
security.rate-limit.public-storefront.capacity=60
security.rate-limit.checkout.capacity=10
security.rate-limit.ai-sales.capacity=20
security.rate-limit.ai-copilot.capacity=30
security.rate-limit.phone-webhook.capacity=120
security.rate-limit.webhook.capacity=120

# Request Body & Multipart Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB
