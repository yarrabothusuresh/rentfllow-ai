<div class="max-w-4xl mx-auto space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a routerLink="/products" class="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition border border-slate-700">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </a>
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">{{ isEditMode ? 'Edit Product' : 'Create New Rental Product' }}</h1>
        <p class="text-sm text-slate-400">{{ isEditMode ? 'Update pricing, replacement values, and status' : 'Add a new rental asset to your tenant product catalog' }}</p>
      </div>
    </div>
  </div>

  <!-- Form Container -->
  <form (ngSubmit)="onSubmit()" class="bg-slate-900/90 rounded-2xl border border-slate-800/80 p-6 md:p-8 shadow-xl space-y-6 backdrop-blur-md">
    <div *ngIf="error" class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm">
      {{ error }}
    </div>

    <!-- Basic Information Section -->
    <div>
      <h2 class="text-base font-semibold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
        <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        General Details
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Product Name <span class="text-rose-400">*</span></label>
          <input
            type="text"
            [(ngModel)]="product.name"
            name="name"
            required
            placeholder="e.g. Chiavari Chair (Gold)"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">SKU / Item Code <span class="text-rose-400">*</span></label>
          <input
            type="text"
            [(ngModel)]="product.sku"
            name="sku"
            required
            placeholder="e.g. CHI-001"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white text-sm font-mono focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Category</label>
          <select
            [(ngModel)]="product.categoryId"
            name="categoryId"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-indigo-500 transition"
          >
            <option value="">Select Category...</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Product Type</label>
          <select
            [(ngModel)]="product.productType"
            name="productType"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-indigo-500 transition"
          >
            <option *ngFor="let t of productTypes" [value]="t">{{ t }}</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Catalog Status</label>
          <select
            [(ngModel)]="product.status"
            name="status"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-indigo-500 transition"
          >
            <option *ngFor="let s of productStatuses" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Image URL</label>
          <input
            type="text"
            [(ngModel)]="product.imageUrl"
            name="imageUrl"
            placeholder="https://images.unsplash.com/..."
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          />
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Description</label>
          <textarea
            [(ngModel)]="product.description"
            name="description"
            rows="3"
            placeholder="Detailed description, dimensions, color, material, and notes..."
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Financials & Inventory Owned Section -->
    <div>
      <h2 class="text-base font-semibold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Pricing & Initial Stock
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Rental Price ($/day)</label>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="product.rentalPrice"
            name="rentalPrice"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-emerald-400 font-bold text-sm focus:outline-none focus:border-indigo-500 transition"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Replacement Cost ($)</label>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="product.replacementCost"
            name="replacementCost"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-200 font-bold text-sm focus:outline-none focus:border-indigo-500 transition"
          />
        </div>

        <div *ngIf="!isEditMode">
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Initial Quantity Owned</label>
          <input
            type="number"
            [(ngModel)]="product.quantityOwned"
            name="quantityOwned"
            min="0"
            class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white font-bold text-sm focus:outline-none focus:border-indigo-500 transition"
          />
        </div>
      </div>
    </div>

    <!-- Form Action Buttons -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
      <a routerLink="/products" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 transition">
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="saving"
        class="px-6 py-2.5 rounded-xl text-sm font-medium text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 shadow-lg shadow-indigo-600/30 border border-indigo-400/30 transition disabled:opacity-50"
      >
        {{ saving ? 'Saving...' : (isEditMode ? 'Save Changes' : 'Create Product') }}
      </button>
    </div>
  </form>
</div>
