<div class="login-page">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-icon">⚡</span>
          <span class="brand-name">RentFlow AI</span>
        </div>
        <h1 class="welcome-title">Welcome Back</h1>
        <p class="welcome-subtitle">Sign in to your secure rental operations dashboard</p>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onLogin()" class="login-form">
        <div class="form-group">
          <label for="email">Work Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="e.g. owner@demo.local"
              required
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="spinner">Verifying...</span>
        </button>
      </form>

      <div class="demo-section">
        <p class="demo-title">Quick Demo Login Shortcuts</p>
        <div class="demo-chips">
          <button
            type="button"
            *ngFor="let acc of demoAccounts"
            class="demo-chip"
            (click)="useDemoAccount(acc)"
          >
            {{ acc.label }}
          </button>
        </div>
      </div>

      <div class="portal-link-footer">
        Looking for the Customer Portal?
        <a routerLink="/portal/login" class="portal-link">Customer Sign In →</a>
      </div>
    </div>
  </div>
</div>
