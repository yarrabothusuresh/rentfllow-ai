version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentflow_prod
      POSTGRES_USER: rentflow_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongSecurePostgresPass123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow_user -d rentflow_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rentflow_prod
      DB_USER: rentflow_user
      DB_PASSWORD: ${DB_PASSWORD:-StrongSecurePostgresPass123!}
      JWT_SECRET: ${JWT_SECRET:-RentFlowProductionSuperSecureSecretKeyMustBe32BytesLongMin!}
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.rentflow.ai,https://portal.rentflow.ai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEPHONY_PROVIDER: mock
      TELEPHONY_WEBHOOK_SECRET: ${TELEPHONY_WEBHOOK_SECRET:-MockTelephonySecret123!}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
